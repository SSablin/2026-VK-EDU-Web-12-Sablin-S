{% load static %}
<article class="card mb-4">
    <div class="card-body">
        <div class="d-flex gap-3">

            <img src="{% static 'img/avatar.png' %}" alt="Avatar" width="48" height="48"
                 class="rounded-circle bg-secondary flex-shrink-0">

            <div class="flex-grow-1">
                <h1 class="h4 mb-3">{{ question.title }}</h1>
                <p class="mb-3">{{ question.text }}</p>
                <div class="d-flex align-items-center gap-3 flex-wrap mb-2">
                    {% for tag in question.tags %}
                        <a href="{% url 'tag' tag_name=tag %}"
                           class="badge text-bg-secondary text-decoration-none">{{ tag }}</a>
                    {% endfor %}
                    <span class="text-muted small">{{ answers_count }} answers</span>
                </div>
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-sm btn-success" aria-label="Upvote">▲</button>
                <div class="fw-bold">{{ question.rating }}</div>
                <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Downvote">▼</button>
            </div>
        </div>
    </div>
</article>
