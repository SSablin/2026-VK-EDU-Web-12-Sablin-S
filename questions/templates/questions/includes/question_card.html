{% load static %}
<article class="card mb-3">
    <div class="card-body">
        <div class="d-flex gap-3">

            <img src="{% static 'img/avatar.png' %}" alt="Avatar" width="48" height="48"
                 class="rounded-circle bg-secondary flex-shrink-0">

            <div class="flex-grow-1">
                <a href="{% url 'question' question_id=question.id %}"
                   class="h5 text-decoration-none d-block mb-2" title="{{ question.title }}">
                    {{ question.title }}
                </a>
                <p class="text-muted mb-2">
                    {{ question.text }}
                </p>

                <div class="d-flex align-items-center gap-3 flex-wrap">
                    {% for tag in question.tags %}
                        <a href="{% url 'tag' tag_name=tag %}"
                           class="badge text-bg-secondary text-decoration-none">{{ tag }}</a>
                    {% endfor %}
                </div>
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-sm btn-outline-success" aria-label="Upvote">▲</button>
                <div class="fw-bold">{{ question.rating }}</div>
                <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Downvote">▼</button>
            </div>
        </div>
    </div>
</article>
