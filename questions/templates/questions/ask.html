{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block title %}AskMe — ask{% endblock %}
{% block content %}
<h1>New question</h1>

<form action="{% url 'ask' %}" method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="d-flex gap-3 mb-3">
        <label for="{{ field.id_for_label }}" class="text-nowrap form-label-col">
            {{ field.label }}
        </label>
        <div class="flex-grow-1">
            {% bootstrap_field field show_label=False placeholder="" %}
        </div>
    </div>
    {% endfor %}

    <div class="d-flex gap-3">
        <span class="form-label-col"></span>
        <button type="submit" class="btn btn-primary">ASK!</button>
    </div>
</form>
{% endblock %}
