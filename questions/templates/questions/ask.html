{% extends 'base.html' %}
{% block title %}AskMe — ask{% endblock %}
{% block content %}
<h1>New question</h1>

<form action="#" method="post" novalidate>
    <div class="d-flex gap-3 mb-3">
        <label for="title" class="text-nowrap form-label-col">Title</label>
        <div class="flex-grow-1">
            <input id="title" name="title" class="form-control is-invalid" maxlength="120" required>
            <div class="invalid-feedback">Title is required.</div>
            <div class="form-text">Not more than 120 characters.</div>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="text_question" class="text-nowrap form-label-col">Text question</label>
        <div class="flex-grow-1">
                            <textarea id="text_question" name="text_question" class="form-control" rows="5"
                                      required></textarea>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="tags" class="text-nowrap form-label-col">Tags</label>
        <div class="flex-grow-1">
            <input id="tags" name="tags" class="form-control" maxlength="300">
            <div class="form-text">Enter tags separated by commas.</div>
        </div>
    </div>

    <div class="d-flex gap-3">
        <span class="form-label-col"></span>
        <button type="submit" class="btn btn-primary">ASK!</button>
    </div>
</form>
{% endblock %}
