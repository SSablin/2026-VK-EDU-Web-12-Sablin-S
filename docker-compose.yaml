services:
  redis:
    image: redis:7-alpine

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8005:8000"

  db:
    image: postgres:16
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    env_file:
      - .env.docker
    environment:
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_URL: http://centrifugo:8000/api
      CENTRIFUGO_WS_URL: ws://127.0.0.1:8005/connection/websocket
    ports:
      - "8000:8000"
    volumes:
      - media:/web/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./application
          target: /web/application
          ignore:
            - "**/__pycache__/"
        - action: sync
          path: ./core
          target: /web/core
          ignore:
            - "**/__pycache__/"
        - action: sync
          path: ./questions
          target: /web/questions
          ignore:
            - "**/__pycache__/"
        - action: sync
          path: ./templates
          target: /web/templates
        - action: sync
          path: ./static
          target: /web/static
        - action: sync
          path: ./public
          target: /web/public
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile

  celery:
    build:
      context: .
    env_file:
      - .env.docker
    environment:
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_URL: http://centrifugo:8000/api
    command: celery -A application worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./application
          target: /web/application
          ignore:
            - "**/__pycache__/"
        - action: sync+restart
          path: ./core
          target: /web/core
          ignore:
            - "**/__pycache__/"
        - action: sync+restart
          path: ./questions
          target: /web/questions
          ignore:
            - "**/__pycache__/"
        - action: rebuild
          path: ./requirements.txt
  celery-beat:
    build:
      context: .
    env_file:
      - .env.docker
    environment:
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_URL: http://centrifugo:8000/api
    command: celery -A application beat -l info --scheduler redbeat.RedBeatScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  media:
  postgres_data:
