services:
  db:
    image: postgres:16
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/web
      - media:/web/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  media:
  postgres_data:
