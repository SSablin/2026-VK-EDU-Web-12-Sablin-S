services:
  redis:
    image: redis:7-alpine

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8005:8000"

  db:
    image: postgres:16
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    env_file:
      - .env.docker
    environment:
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_URL: http://centrifugo:8000/api
      CENTRIFUGO_WS_URL: ws://127.0.0.1:8005/connection/websocket
    ports:
      - "8000:8000"
    volumes:
      - .:/web
      - media:/web/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: .
    env_file:
      - .env.docker
    environment:
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_URL: http://centrifugo:8000/api
    command: celery -A application worker -l info
    volumes:
      - .:/web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  media:
  postgres_data:
