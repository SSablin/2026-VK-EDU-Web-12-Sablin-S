{% extends 'base.html' %}
{% block title %}AskMe — register{% endblock %}
{% block content %}
<div class="d-flex gap-3">
    <h1>Register</h1>
</div>

<form action="#" method="post" novalidate>
    <div class="d-flex gap-3 mb-3">
        <label for="login" class="text-nowrap form-label-col">Login</label>
        <div class="flex-grow-1">
            <input id="login" name="login" class="form-control" required>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="email" class="text-nowrap form-label-col">Email</label>
        <div class="flex-grow-1">
            <input id="email" name="email" class="form-control" type="email" required>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="nickname" class="text-nowrap form-label-col">NickName</label>
        <div class="flex-grow-1">
            <input id="nickname" name="nickname" class="form-control" type="text" required>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="password" class="text-nowrap form-label-col">Password</label>
        <div class="flex-grow-1">
            <input id="password" name="password" class="form-control" type="password" required>
            <div class="form-text">Choose a strong password.</div>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="repeat_password" class="text-nowrap form-label-col">Repeat
            Password</label>
        <div class="flex-grow-1">
            <input id="repeat_password" name="repeat_password" class="form-control" type="password"
                   required>
        </div>
    </div>

    <div class="d-flex gap-3">
        <span class="form-label-col"></span>
        <button type="submit" class="btn btn-primary">Register!</button>
    </div>
</form>
{% endblock %}
