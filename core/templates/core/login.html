{% extends 'base.html' %}
{% block title %}AskMe — login{% endblock %}
{% block content %}
<form action="#" method="post" novalidate>

    <div class="d-flex gap-3">
        <h1>Log In</h1>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="login" class="text-nowrap form-label-col">Login</label>
        <div class="flex-grow-1">
            <input id="login" name="login" class="form-control" required>
        </div>
    </div>

    <div class="d-flex gap-3 mb-3">
        <label for="password" class="text-nowrap form-label-col">Password</label>
        <div class="flex-grow-1">
            <input id="password" name="password" class="form-control" type="password" required>
        </div>
    </div>

    <div class="d-flex gap-3">
        <span class="form-label-col"></span>
        <button type="submit" class="btn btn-primary">Log In!</button>
    </div>

    <div class="d-flex gap-3">
        <span class="form-label-col"></span>
        <a href="{% url 'signup' %}">create new account</a>
    </div>
</form>
{% endblock %}
