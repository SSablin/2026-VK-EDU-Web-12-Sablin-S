<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AskMe — settings</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" href="static/img/favicon.png" type="image/png">
</head>

<body class="d-flex flex-column min-vh-100">

<header class="bg-white border-bottom py-3">
    <div class="container d-flex flex-wrap align-items-center gap-2 gap-lg-3">
        <a href="index.html" class="fs-4 fw-bold text-decoration-none">AskMe</a>
        <input type="search" class="form-control flex-grow-1 header-search"
               placeholder="Search..." aria-label="Search">
        <a href="ask.html" class="btn btn-primary text-nowrap">ASK!</a>
        <div class="d-flex align-items-center gap-2">
            <a href="profile.html">
                <img src="static/img/avatar.png" alt="Avatar" width="40" height="40"
                     class="rounded-circle bg-secondary">
            </a>
            <span>Ivan</span>
        </div>
    </div>
</header>

<div class="container my-4 flex-grow-1">
    <div class="row g-4">

        <main class="col-12 col-lg-8">

            <div class="d-flex gap-3">
                <h1>Settings: Ivan</h1>
            </div>

            <form action="#" method="post" novalidate enctype="multipart/form-data">
                <div class="d-flex gap-3 mb-3">
                    <label for="login" class="text-nowrap form-label-col">Login</label>
                    <div class="flex-grow-1">
                        <input id="login" name="login" class="form-control" type="text" required>
                    </div>
                </div>

                <div class="d-flex gap-3 mb-3">
                    <label for="email" class="text-nowrap form-label-col">Email</label>
                    <div class="flex-grow-1">
                        <input id="email" name="email" class="form-control is-invalid" type="email" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>

                <div class="d-flex gap-3 mb-3">
                    <label for="nickname" class="text-nowrap form-label-col">NickName</label>
                    <div class="flex-grow-1">
                        <input id="nickname" name="nickname" class="form-control" type="text" required>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3 mb-3">
                    <label for="avatar" class="text-nowrap form-label-col">Upload avatar</label>
                    <div>
                        <img src="static/img/avatar.png" alt="Avatar" width="80" height="80"
                             class="rounded-circle bg-secondary d-block mb-2">
                        <input id="avatar" name="avatar" type="file" class="form-control" accept="image/png,image/jpeg">
                        <div class="form-text">PNG или JPG, до 2 МБ.</div>
                    </div>
                </div>

                <div class="d-flex gap-3">
                    <span class="form-label-col"></span>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>

            </form>

        </main>

        <aside class="col-12 col-lg-4">

            <div class="card mb-3">
                <div class="card-header fw-bold">Popular tags</div>
                <div class="card-body d-flex flex-wrap gap-2">
                    <a href="#" class="badge text-bg-danger text-decoration-none">perl</a>
                    <a href="#" class="badge text-bg-primary text-decoration-none">python</a>
                    <a href="#" class="badge text-bg-primary text-decoration-none">TechnoPark</a>
                    <a href="#" class="badge text-bg-primary text-decoration-none">MySQL</a>
                    <a href="#" class="badge text-bg-success text-decoration-none">django</a>
                    <a href="#" class="badge text-bg-warning text-decoration-none">Mail.ru</a>
                    <a href="#" class="badge text-bg-danger text-decoration-none">Voloshin</a>
                    <a href="#" class="badge text-bg-danger text-decoration-none">Firefox</a>
                </div>
            </div>

            <div class="card">
                <div class="card-header fw-bold">Best members</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <a href="question.html"> Ivan Ivanov
                        </a>
                    </li>
                    <li class="list-group-item">
                        <a href="question.html"> Peter Petrov </a>
                    </li>
                    <li class="list-group-item"><a href="question.html">Anna Sidorova </a></li>
                </ul>
            </div>

        </aside>

    </div>
</div>

<footer class="bg-white border-top py-3 mt-auto">
    <div class="container text-muted small">
        AskMe, 2026
    </div>
</footer>

<script src="static/js/bootstrap.bundle.min.js"></script>
</body>

</html>
