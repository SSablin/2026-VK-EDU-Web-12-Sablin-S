{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AskMe{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">
</head>

<body class="d-flex flex-column min-vh-100">
    {% include 'includes/header.html' %}

    <div class="container my-4 flex-grow-1">
        <div class="row g-4">
            <main class="col-12 col-lg-8">
                {% block content %}{% endblock %}
            </main>
            <aside class="col-12 col-lg-4">
                {% include 'includes/sidebar.html' %}
            </aside>
        </div>
    </div>

    {% include 'includes/footer.html' %}
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'questions/script.js' %}?v=2"></script>
    <script src="https://unpkg.com/centrifuge@5.0.0/dist/centrifuge.js"></script>
    {% if centrifugo_channel %}
    <script>
        const centrifuge = new Centrifuge('{{ centrifugo_ws_url|escapejs }}', {
            token: '{{ connection_token|escapejs }}'
        });

        const answerSubscription = centrifuge.newSubscription('{{ centrifugo_channel|escapejs }}');

        answerSubscription.on('publication', function (ctx) {
            const answer = ctx.data;
            if (document.getElementById(`answer-${answer.id}`)) {
                return;
            }

            if (!{{ is_first_answer_page | yesno: 'true,false' }
        }) {
            alert('На вопрос появился новый ответ');
            return;
        }

        const emptyMessage = document.getElementById('empty-answer-message');
        if (emptyMessage) {
            emptyMessage.remove();
        }

        const article = document.createElement('article');
        article.id = `answer-${answer.id}`;
        article.className = 'card mb-3';

        const body = document.createElement('div');
        body.className = 'card-body';

        const text = document.createElement('p');
        text.className = 'mb-2';
        text.textContent = answer.text;

        const author = document.createElement('span');
        author.className = 'text-muted small';
        author.textContent = answer.user;

        body.append(text, author);
        article.append(body);

        const answersList = document.getElementById('answers-list');
        answersList.prepend(article);

        const count = document.getElementById('answer-count');
        const current = Number(count.textContent.match(/\d+/)?.[0] || 0);
        count.textContent = `Answers (${current + 1})`;
    });

        answerSubscription.subscribe();
        centrifuge.connect();
    </script>
    {% endif %}
</body>

</html>
