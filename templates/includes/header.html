<header class="bg-white border-bottom py-3">
    <div class="container d-flex flex-wrap align-items-center gap-2 gap-lg-3">
        <a href="{% url 'index' %}" class="fs-4 fw-bold text-decoration-none">AskMe</a>

        <form action="{% url 'search' %}" method="get" class="flex-grow-1 position-relative">
            <div class="input-group">
                <input type="search" id="header-search-input" name="q" value="{{ request.GET.q }}"
                       class="form-control header-search" autocomplete="off"
                       placeholder="Search..." aria-label="Search">
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </div>
            <div id="search-suggestions"
                 class="list-group position-absolute w-100 shadow-sm mt-1"
                 style="z-index: 1050; display: none;">
            </div>
        </form>

        {% if user.is_authenticated %}
            <a href="{% url 'ask' %}" class="btn btn-primary text-nowrap">ASK!</a>
            <a href="{% url 'profile' %}" class="btn btn-outline-primary text-nowrap">profile</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-primary text-nowrap">logout</a>
        {% else %}
            <a href="{% url 'login' %}?next={{ request.path }}" class="btn btn-primary text-nowrap"
               title="Войдите, чтобы задать вопрос">ASK!</a>
            <a href="{% url 'login' %}" class="btn btn-outline-primary text-nowrap">login</a>
            <a href="{% url 'signup' %}" class="btn btn-outline-primary text-nowrap">register</a>
        {% endif %}
    </div>
</header>
