<div class="card mb-3">
    <div class="card-header fw-bold">Popular tags</div>
    <div class="card-body d-flex flex-wrap gap-2">
        {% for tag in popular_tags %}
            <a href="{% url 'tag' tag_name=tag.title %}"
               class="badge text-bg-primary text-decoration-none">{{ tag.title }}</a>
        {% endfor %}
    </div>
</div>

<div class="card">
    <div class="card-header fw-bold">Best members</div>
    <div class="card-body">
        <ul class="list-group list-group-flush">
            {% for member in best_members %}
                <li class="list-group-item">
                    <a href="{% url 'question' question_id=member.id %}">
                        {{ member.profile.nickname|default:member.username }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>
